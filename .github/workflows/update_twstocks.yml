name: Update TW Eye Stocks
on:
  schedule:
    - cron: '30 6 * * 1-5'   # 週一至五 UTC 06:30 ≈ 台灣 14:30(收盤後)
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        run: pip install requests
      - name: Fetch quotes
        run: python update_twstocks.py
      - name: Commit
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add tw_stocks.json
          if git diff --staged --quiet; then echo "no change"; else
            git commit -m "auto: update TW eye stocks"
            git pull --rebase --autostash origin main || true
            git push
          fi
